[pytest]
# Tests run offline and deterministic by default. The "live" marker (real
# provider calls) is skipped unless run explicitly with `pytest -m live`.
markers =
    live: makes real provider calls; requires OPENAI_API_KEY and network access
addopts = -m "not live"
# tests/ on the import path, so test files can `from helpers import ...`.
pythonpath = tests
